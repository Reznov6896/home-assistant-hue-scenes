# "Scenes" view for a YAML-mode dashboard (one entry of `views:`).
# Layout, top to bottom:
#   1. Light controls: Fade, Shuffle, on/off. The Fade and sleep timer settings stay folded
#      behind their "Settings" tile; "Manage room scenes" opens the management menu.
#   2. The Hue-app-style room card.
#   3. The management menu (Add / Capture current state / Move & rename), each one opening its panel.
#   4. The gallery: one grid per category (only two presets shown here).
# Requirements: hue-like-light-card (Gh61), auto-entities (thomasloven), the scene_presets
# integration (Hypfer) for the gallery, the room_scenes component, www/scene-select-row.js
# declared as a dashboard resource (JavaScript module), and the three packages of examples/
# (the "*_visible" toggles live in effects-package.yaml and management-package.yaml).
title: Scenes
path: scenes
icon: mdi:palette
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Light controls
        icon: mdi:tune-variant

  # 1. Three columns: Fade + its settings, Shuffle + the management menu toggle, on/off + sleep timer.
  - type: grid
    column_span: 1
    cards:
      - type: tile
        entity: input_boolean.fade_active
        name: Fade
        icon: mdi:transition
        vertical: true
        color: amber
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.fade_toggle
        icon_tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.fade_toggle
      - type: tile
        entity: input_boolean.fade_settings_visible
        name: Settings
        icon: mdi:dots-horizontal
        hide_state: true
        color: grey
        grid_options:
          columns: full
          rows: 1
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.fade_settings_visible
            state: "on"
        card:
          type: entities
          title: Fade settings
          entities:
            - entity: input_number.fade_interval
              name: Interval between changes
            - entity: input_number.fade_transition
              name: Transition duration
  - type: grid
    column_span: 1
    cards:
      - type: tile
        entity: script.shuffle_colors
        name: Shuffle
        icon: mdi:shuffle-variant
        vertical: true
        hide_state: true
        color: amber
        grid_options:
          columns: full
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.shuffle_colors
        icon_tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.shuffle_colors
      - type: tile
        entity: input_boolean.room_scenes_menu_visible
        name: Manage room scenes
        icon: mdi:playlist-edit
        hide_state: true
        color: grey
        grid_options:
          columns: full
          rows: 1
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
  - type: grid
    column_span: 1
    cards:
      - type: tile
        entity: light.living_room_all
        name: On / Off
        icon: mdi:power
        vertical: true
        state_content: []
        color: amber
        grid_options:
          columns: full
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.sleep_timer_settings_visible
        name: Settings
        icon: mdi:dots-horizontal
        hide_state: true
        color: grey
        grid_options:
          columns: full
          rows: 1
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.sleep_timer_settings_visible
            state: "on"
        card:
          type: entities
          title: Sleep timer
          entities:
            - entity: input_number.sleep_timer_minutes
              name: Turn off in (0 = off)

  # 2-3. The room card, then the management menu and its panels.
  #   The card's scene list is not written here: auto-entities reads it from the `list` attribute
  #   of the sensor published by room_scenes. The card hides itself while the move/rename panel
  #   is open, so the list being edited stays on screen.
  - type: grid
    column_span: 3
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.room_scenes_manage_visible
            state: "off"
        card:
          type: custom:auto-entities
          card:
            type: custom:hue-like-light-card
            title: Living room
            offColor: "#24272b"
            entities:
              - light.living_room_all
              - light.living_room_1
              - light.living_room_2
              - light.living_room_3
              - light.living_room_4
              - light.living_room_5
              - light.living_room_6
              - light.living_room_7
          card_param: scenes
          filter:
            template: "{{ state_attr('sensor.room_scenes_list', 'list') }}"
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.room_scenes_menu_visible
            state: "on"
        card:
          type: grid
          columns: 3
          square: false
          cards:
            - type: tile
              entity: input_boolean.room_scenes_add_visible
              name: Add
              icon: mdi:playlist-plus
              hide_state: true
              color: green
              tap_action:
                action: toggle
              icon_tap_action:
                action: toggle
            - type: tile
              entity: input_boolean.room_scenes_capture_visible
              name: Capture current state
              icon: mdi:camera-iris
              hide_state: true
              color: blue
              tap_action:
                action: toggle
              icon_tap_action:
                action: toggle
            - type: tile
              entity: input_boolean.room_scenes_manage_visible
              name: Move / rename
              icon: mdi:sort
              hide_state: true
              color: purple
              tap_action:
                action: toggle
              icon_tap_action:
                action: toggle
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.room_scenes_add_visible
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: entities
              title: Add an existing scene
              entities:
                - entity: input_select.room_scenes_add_choice
                  name: Scene to add
            - type: tile
              entity: script.room_scenes_add
              name: Add to the list
              icon: mdi:check
              hide_state: true
              color: green
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.room_scenes_add
              icon_tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.room_scenes_add
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.room_scenes_capture_visible
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: entities
              title: Capture the current light states
              entities:
                - entity: input_text.room_scenes_new_name
                  name: Name of the new scene
            - type: tile
              entity: script.room_scenes_capture
              name: Capture
              icon: mdi:camera-iris
              hide_state: true
              color: blue
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.room_scenes_capture
              icon_tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.room_scenes_capture
        grid_options:
          columns: full
      # Move / rename panel: `custom:scene-select-row` rows (`rows` attribute of the same sensor).
      # "Select" puts the scene in the dropdown, which the four buttons below then use.
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.room_scenes_manage_visible
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: custom:auto-entities
              card:
                type: entities
                title: Current scenes
              filter:
                template: "{{ state_attr('sensor.room_scenes_list', 'rows') }}"
            - type: entities
              title: Move, rename or remove
              entities:
                - entity: input_select.room_scenes_manage
                  name: Selected scene
                - entity: input_text.room_scenes_new_title
                  name: New title (to rename)
            - type: grid
              columns: 4
              square: false
              cards:
                - type: tile
                  entity: script.room_scenes_rename
                  name: Rename
                  icon: mdi:rename-box
                  hide_state: true
                  color: purple
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.room_scenes_rename
                - type: tile
                  entity: script.room_scenes_move_up
                  name: Up
                  icon: mdi:arrow-up-bold
                  hide_state: true
                  color: purple
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.room_scenes_move_up
                - type: tile
                  entity: script.room_scenes_move_down
                  name: Down
                  icon: mdi:arrow-down-bold
                  hide_state: true
                  color: purple
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.room_scenes_move_down
                - type: tile
                  entity: script.room_scenes_remove
                  name: Remove
                  icon: mdi:playlist-remove
                  hide_state: true
                  color: red
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.room_scenes_remove
                    confirmation:
                      text: Remove this scene from the list? The scene itself is kept.
        grid_options:
          columns: full

  # 4. One gallery category: tap applies the preset to the group, hold applies it with its
  #    colours shuffled across the lights (scene_presets `shuffle` option).
  #    IDs come from scene_presets' presets.json. `columns: 4` gives nine presets per row.
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Serenity
        icon: mdi:meditation
      - type: picture-glance
        title: Galaxy
        image: /assets/scene_presets/a6ba3a6e-1e3a-41fd-84f2-f7b021935deb.jpeg
        entities: []
        aspect_ratio: "1:1"
        grid_options:
          columns: 4
        tap_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a6ba3a6e-1e3a-41fd-84f2-f7b021935deb
            targets:
              entity_id: light.living_room_all
        hold_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a6ba3a6e-1e3a-41fd-84f2-f7b021935deb
            shuffle: true
            targets:
              entity_id: light.living_room_all
      - type: picture-glance
        title: Starlight
        image: /assets/scene_presets/a2f95aab-e80a-4aca-ae32-142cdc7ad3e0.jpeg
        entities: []
        aspect_ratio: "1:1"
        grid_options:
          columns: 4
        tap_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a2f95aab-e80a-4aca-ae32-142cdc7ad3e0
            targets:
              entity_id: light.living_room_all
        hold_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a2f95aab-e80a-4aca-ae32-142cdc7ad3e0
            shuffle: true
            targets:
              entity_id: light.living_room_all
