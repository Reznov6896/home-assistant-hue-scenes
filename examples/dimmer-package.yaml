# Home Assistant package: Hue dimmer switch (RWL022) paired directly over Zigbee (ZHA).
# Copy to packages/. Replace the 7 occurrences of "<dimmer IEEE>" with the dimmer's IEEE address
# (Settings -> Devices -> the dimmer -> Zigbee info).
# Example entities: light.living_room_1 to light.living_room_7 + their group
# light.living_room_all (see scene-list-package.yaml).
#
# Button mapping:
#   Up,   short press: cycle of 3 warm whites  2000 K 50 % -> 2000 K 100 % -> 2500 K 100 %
#   Up,   long press : all off
#   Down, short press: cycle of 3 cool whites  6500 K 50 % -> 6500 K 100 % -> 4000 K 100 %
#   +/-,  short press: brightness +/-12 %, light by light
#   Down, +, - long press: triggers in place, no action (reserved)
#
# The dimmer sends `zha_event` events (no button entity): `on_short_release`,
# `on_long_release`, `off_short_release`, `step` (args[0] = 0 for +, 1 for -)...
# A long press is recognised on RELEASE: the dimmer itself classifies the press as "long".

input_number:
  dimmer_up_cycle:
    name: "Dimmer Up - cycle step"
    min: 0
    max: 2
    step: 1
    initial: 0
    mode: box
  dimmer_down_cycle:
    name: "Dimmer Down - cycle step"
    min: 0
    max: 2
    step: 1
    initial: 0
    mode: box

# The time of the last press is stored APART from the cycle step: HA does not refresh
# `last_updated` when an entity is set to the value it already has. A timer computed on the
# cycle entity stayed frozen, and the cycle got stuck on its first step.
input_datetime:
  dimmer_up_last_press:
    name: "Dimmer Up - last short press"
    has_date: true
    has_time: true
  dimmer_down_last_press:
    name: "Dimmer Down - last short press"
    has_date: true
    has_time: true

automation:
  - id: hue_dimmer_up
    alias: Hue dimmer - Up button (warm white cycle + off)
    description: >-
      Short press: 3-step cycle (2000K/50 %, 2000K/100 %, 2500K/100 %). The decision is based on
      the ACTUAL state of the lights, not only on the counter (which stayed at 0 after the lights
      were turned off another way or after an HA restart). Lights off: step 1. More than 30 min
      without a short press on THIS button: step 1, unless the lights are already there (read
      on the group), then step 2, so a press is never wasted. Presses within 10 s: the cycle
      follows the counter. Switching button (Up/Down) or turning off resets the other cycle.
      Long press: all off.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: on_short_release
      id: short
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: on_long_release
      id: long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: short
        sequence:
        - variables:
            current_step: '{{ states(''input_number.dimmer_up_cycle'') | int(0) }}'
            elapsed: '{{ now().timestamp() - as_timestamp(states(''input_datetime.dimmer_up_last_press''), 0) }}'
            lights_on: '{{ is_state(''light.living_room_all'', ''on'') }}'
            already_step0: '{{ is_state(''light.living_room_all'', ''on'') and ((state_attr(''light.living_room_all'', ''color_temp_kelvin'') | int(0)) - 2000) | abs < 150 and ((state_attr(''light.living_room_all'', ''brightness'') | int(0)) - 128) | abs < 13 }}'
        # < 10 s: follow the counter; lights off: step 0; > 30 min: step 0 (or 1 if already at 0).
        - variables:
            next_step: '{{ (current_step + 1) % 3 if elapsed | float < 10 else 0 if not lights_on else (1 if already_step0 else 0) if elapsed | float > 1800 else (current_step + 1) % 3 }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dimmer_up_last_press
          data:
            timestamp: '{{ now().timestamp() }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_up_cycle
          data:
            value: '{{ next_step }}'
        # The other button restarts from its first step on its next press.
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_down_cycle
          data:
            value: 2
        - action: light.turn_on
          target:
            entity_id:
            - light.living_room_1
            - light.living_room_2
            - light.living_room_3
            - light.living_room_4
            - light.living_room_5
            - light.living_room_6
            - light.living_room_7
          data:
            color_temp_kelvin: '{{ {0: 2000, 1: 2000, 2: 2500}[next_step] }}'
            brightness_pct: '{{ {0: 50, 1: 100, 2: 100}[next_step] }}'
      - conditions:
        - condition: trigger
          id: long
        sequence:
        - action: light.turn_off
          target:
            entity_id:
            - light.living_room_1
            - light.living_room_2
            - light.living_room_3
            - light.living_room_4
            - light.living_room_5
            - light.living_room_6
            - light.living_room_7
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_up_cycle
          data:
            value: 2
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_down_cycle
          data:
            value: 2
    mode: restart

  - id: hue_dimmer_down
    alias: Hue dimmer - Down button (cool white cycle)
    description: >-
      Short press: 3-step cycle (6500K/50 %, 6500K/100 %, 4000K/100 %). Same logic as the Up
      button, on the ACTUAL state of the lights: off, step 1; more than 30 min without a press,
      step 1, unless already at 6500K/50 %, then step 2; presses within 10 s, the counter.
      Long press: trigger in place, no action.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: off_short_release
      id: short
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: off_long_release
      id: long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: short
        sequence:
        - variables:
            current_step: '{{ states(''input_number.dimmer_down_cycle'') | int(0) }}'
            elapsed: '{{ now().timestamp() - as_timestamp(states(''input_datetime.dimmer_down_last_press''), 0) }}'
            lights_on: '{{ is_state(''light.living_room_all'', ''on'') }}'
            already_step0: '{{ is_state(''light.living_room_all'', ''on'') and ((state_attr(''light.living_room_all'', ''color_temp_kelvin'') | int(0)) - 6500) | abs < 150 and ((state_attr(''light.living_room_all'', ''brightness'') | int(0)) - 128) | abs < 13 }}'
        - variables:
            next_step: '{{ (current_step + 1) % 3 if elapsed | float < 10 else 0 if not lights_on else (1 if already_step0 else 0) if elapsed | float > 1800 else (current_step + 1) % 3 }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.dimmer_down_last_press
          data:
            timestamp: '{{ now().timestamp() }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_down_cycle
          data:
            value: '{{ next_step }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.dimmer_up_cycle
          data:
            value: 2
        - action: light.turn_on
          target:
            entity_id:
            - light.living_room_1
            - light.living_room_2
            - light.living_room_3
            - light.living_room_4
            - light.living_room_5
            - light.living_room_6
            - light.living_room_7
          data:
            color_temp_kelvin: '{{ {0: 6500, 1: 6500, 2: 4000}[next_step] }}'
            brightness_pct: '{{ {0: 50, 1: 100, 2: 100}[next_step] }}'
      - conditions:
        - condition: trigger
          id: long
        sequence: []
    mode: restart

  - id: hue_dimmer_brightness
    alias: Hue dimmer - +/- buttons (brightness)
    description: >-
      Short press +/-: brightness +/-12 %. Lights are targeted one by one, not through the
      group: each one starts from its own brightness. Long presses: triggers in place, no action.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: step
      id: step
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: up_long_release
      id: plus_long
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<dimmer IEEE>"
        command: down_long_release
      id: minus_long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: step
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.living_room_1
            - light.living_room_2
            - light.living_room_3
            - light.living_room_4
            - light.living_room_5
            - light.living_room_6
            - light.living_room_7
          data:
            brightness_step_pct: '{{ 12 if trigger.event.data.args[0] == 0 else -12 }}'
      - conditions:
        - condition: trigger
          id: plus_long
        sequence: []
      - conditions:
        - condition: trigger
          id: minus_long
        sequence: []
    mode: restart
