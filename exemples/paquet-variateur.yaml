# Paquet Home Assistant : le variateur mural Hue (modèle RWL022) relié en Zigbee direct (ZHA).
# À copier dans packages/. Remplacer les 7 occurrences de « <IEEE du variateur> » par l'adresse
# IEEE du variateur (Paramètres → Appareils → le variateur → Informations Zigbee).
# Entités renommées pour l'exemple : light.sejour_1 à light.sejour_7 + leur groupe
# light.sejour_toutes_les_lampes (voir paquet-liste-des-scenes.yaml).
#
# Ce que fait chaque bouton :
#   Haut, appui court : cycle de 3 blancs chauds  2000 K 50 % → 2000 K 100 % → 2500 K 100 %
#   Haut, appui long  : tout éteindre
#   Bas,  appui court : cycle de 3 blancs froids  6500 K 50 % → 6500 K 100 % → 4000 K 100 %
#   +/-,  appui court : luminosité ±12 %, lampe par lampe
#   Bas, +, - en appui long : déclencheurs posés, sans action (réservés pour plus tard)
#
# Le variateur envoie des événements `zha_event` (pas d'entité bouton) : `on_short_release`,
# `on_long_release`, `off_short_release`, `step` (args[0] = 0 pour +, 1 pour −)…
# L'appui long est reconnu au RELÂCHEMENT : c'est le variateur qui classe l'appui « long ».

input_number:
  variateur_haut_cycle:
    name: "Variateur Haut - étape du cycle"
    min: 0
    max: 2
    step: 1
    initial: 0
    mode: box
  variateur_bas_cycle:
    name: "Variateur Bas - étape du cycle"
    min: 0
    max: 2
    step: 1
    initial: 0
    mode: box

# L'heure du dernier appui est gardée À PART de l'étape du cycle : HA ne rafraîchit pas
# `last_updated` quand on redonne à une entité la valeur qu'elle a déjà. Un minuteur calculé sur
# l'entité du cycle restait donc figé, et le cycle se bloquait sur sa première étape.
input_datetime:
  variateur_haut_dernier_appui:
    name: "Variateur Haut - dernier appui court"
    has_date: true
    has_time: true
  variateur_bas_dernier_appui:
    name: "Variateur Bas - dernier appui court"
    has_date: true
    has_time: true

automation:
  - id: '1784800000001'
    alias: Variateur Hue - Bouton Haut (cycle blanc chaud + extinction)
    description: >-
      Appui court : cycle de 3 états (2000K/50 %, 2000K/100 %, 2500K/100 %). La décision se prend
      sur l'état RÉEL des lampes, pas sur le seul compteur (qui restait à 0 après une extinction
      par un autre moyen ou un redémarrage de HA). Lampes éteintes : 1re étape. Plus de 30 min
      sans appui court sur CE bouton : 1re étape, sauf si les lampes y sont déjà (lu sur le
      groupe), alors 2e étape, pour ne jamais gaspiller un appui. Appuis enchaînés (moins de
      10 s) : le cycle suit le compteur. Changer de bouton (Haut/Bas) ou éteindre remet l'autre
      cycle au départ. Appui long : tout éteindre.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: on_short_release
      id: court
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: on_long_release
      id: long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: court
        sequence:
        - variables:
            position_actuelle: '{{ states(''input_number.variateur_haut_cycle'') | int(0) }}'
            ecart: '{{ now().timestamp() - as_timestamp(states(''input_datetime.variateur_haut_dernier_appui''), 0) }}'
            lampes_allumees: '{{ is_state(''light.sejour_toutes_les_lampes'', ''on'') }}'
            deja_etape0: '{{ is_state(''light.sejour_toutes_les_lampes'', ''on'') and ((state_attr(''light.sejour_toutes_les_lampes'', ''color_temp_kelvin'') | int(0)) - 2000) | abs < 150 and ((state_attr(''light.sejour_toutes_les_lampes'', ''brightness'') | int(0)) - 128) | abs < 13 }}'
        # < 10 s : on suit le compteur ; éteintes : étape 0 ; > 30 min : étape 0 (ou 1 si déjà à 0).
        - variables:
            next_step: '{{ (position_actuelle + 1) % 3 if ecart | float < 10 else 0 if not lampes_allumees else (1 if deja_etape0 else 0) if ecart | float > 1800 else (position_actuelle + 1) % 3 }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.variateur_haut_dernier_appui
          data:
            timestamp: '{{ now().timestamp() }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_haut_cycle
          data:
            value: '{{ next_step }}'
        # L'autre bouton repart de sa 1re étape au prochain appui.
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_bas_cycle
          data:
            value: 2
        - action: light.turn_on
          target:
            entity_id:
            - light.sejour_1
            - light.sejour_2
            - light.sejour_3
            - light.sejour_4
            - light.sejour_5
            - light.sejour_6
            - light.sejour_7
          data:
            color_temp_kelvin: '{{ {0: 2000, 1: 2000, 2: 2500}[next_step] }}'
            brightness_pct: '{{ {0: 50, 1: 100, 2: 100}[next_step] }}'
      - conditions:
        - condition: trigger
          id: long
        sequence:
        - action: light.turn_off
          target:
            entity_id:
            - light.sejour_1
            - light.sejour_2
            - light.sejour_3
            - light.sejour_4
            - light.sejour_5
            - light.sejour_6
            - light.sejour_7
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_haut_cycle
          data:
            value: 2
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_bas_cycle
          data:
            value: 2
    mode: restart

  - id: '1784800000002'
    alias: Variateur Hue - Bouton Bas (cycle blanc froid)
    description: >-
      Appui court : cycle de 3 états (6500K/50 %, 6500K/100 %, 4000K/100 %). Même logique que le
      bouton Haut, sur l'état RÉEL des lampes : éteintes, 1re étape ; plus de 30 min sans appui,
      1re étape, sauf si déjà à 6500K/50 %, alors 2e ; appuis enchaînés (moins de 10 s), le
      compteur. Appui long : déclencheur posé, sans action.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: off_short_release
      id: court
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: off_long_release
      id: long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: court
        sequence:
        - variables:
            position_actuelle: '{{ states(''input_number.variateur_bas_cycle'') | int(0) }}'
            ecart: '{{ now().timestamp() - as_timestamp(states(''input_datetime.variateur_bas_dernier_appui''), 0) }}'
            lampes_allumees: '{{ is_state(''light.sejour_toutes_les_lampes'', ''on'') }}'
            deja_etape0: '{{ is_state(''light.sejour_toutes_les_lampes'', ''on'') and ((state_attr(''light.sejour_toutes_les_lampes'', ''color_temp_kelvin'') | int(0)) - 6500) | abs < 150 and ((state_attr(''light.sejour_toutes_les_lampes'', ''brightness'') | int(0)) - 128) | abs < 13 }}'
        - variables:
            next_step: '{{ (position_actuelle + 1) % 3 if ecart | float < 10 else 0 if not lampes_allumees else (1 if deja_etape0 else 0) if ecart | float > 1800 else (position_actuelle + 1) % 3 }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.variateur_bas_dernier_appui
          data:
            timestamp: '{{ now().timestamp() }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_bas_cycle
          data:
            value: '{{ next_step }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.variateur_haut_cycle
          data:
            value: 2
        - action: light.turn_on
          target:
            entity_id:
            - light.sejour_1
            - light.sejour_2
            - light.sejour_3
            - light.sejour_4
            - light.sejour_5
            - light.sejour_6
            - light.sejour_7
          data:
            color_temp_kelvin: '{{ {0: 6500, 1: 6500, 2: 4000}[next_step] }}'
            brightness_pct: '{{ {0: 50, 1: 100, 2: 100}[next_step] }}'
      - conditions:
        - condition: trigger
          id: long
        sequence: []
    mode: restart

  - id: '1784800000003'
    alias: Variateur Hue - Boutons +/- (luminosité)
    description: >-
      Appui court +/- : luminosité ±12 %. Les lampes sont visées une à une, pas par le groupe :
      chacune part de sa propre luminosité. Appuis longs : déclencheurs posés, sans action.
    triggers:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: step
      id: pas
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: up_long_release
      id: plus_long
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: "<IEEE du variateur>"
        command: down_long_release
      id: moins_long
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: pas
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.sejour_1
            - light.sejour_2
            - light.sejour_3
            - light.sejour_4
            - light.sejour_5
            - light.sejour_6
            - light.sejour_7
          data:
            brightness_step_pct: '{{ 12 if trigger.event.data.args[0] == 0 else -12 }}'
      - conditions:
        - condition: trigger
          id: plus_long
        sequence: []
      - conditions:
        - condition: trigger
          id: moins_long
        sequence: []
    mode: restart
