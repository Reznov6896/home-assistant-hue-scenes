# Exemple de vue « Scènes » pour un tableau de bord en YAML (une entrée de `views:`), version courte.
# La vue réelle a quatre blocs : contrôle des lampes (fondu, shuffle, marche/arrêt, extinction
# planifiée), la carte du séjour, le panneau de gestion, puis la galerie (20 catégories).
# Ici : la carte, la liste de gestion et une catégorie de la galerie.
# Prérequis : la carte hue-like-light-card (Gh61), auto-entities (thomasloven), l'intégration
# scene_presets (Hypfer) pour la galerie, le composant sejour_scenes, et www/scene-choix-row.js
# déclaré comme ressource du tableau de bord (type « module »).
title: Scènes
path: scenes
icon: mdi:palette
type: sections
max_columns: 3
sections:
  # 1. La carte « façon appli Hue ». Sa liste de scènes n'est pas écrite ici : auto-entities la
  #    lit dans l'attribut `list` du capteur publié par sejour_scenes, et la place dans le
  #    paramètre `scenes` de la carte. Toute modification de la liste s'affiche aussitôt.
  - type: grid
    column_span: 3
    cards:
      - type: custom:auto-entities
        card:
          type: custom:hue-like-light-card
          title: Séjour
          entities:
            - light.sejour_toutes_les_lampes
            - light.sejour_1
            - light.sejour_2
            - light.sejour_3
            - light.sejour_4
            - light.sejour_5
            - light.sejour_6
            - light.sejour_7
        card_param: scenes
        filter:
          template: "{{ state_attr('sensor.sejour_scenes_list', 'list') }}"
        grid_options:
          columns: full

  # 2. La liste de gestion : des lignes `custom:scene-choix-row` (attribut `rows` du même capteur).
  #    « Activer » y SÉLECTIONNE la scène dans la liste déroulante, qui sert ensuite aux boutons
  #    Renommer / Monter / Descendre / Retirer (de petits scripts qui appellent les services
  #    sejour_scenes.*, non fournis ici).
  - type: grid
    column_span: 3
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: Scénarios actuels du séjour
        filter:
          template: "{{ state_attr('sensor.sejour_scenes_list', 'rows') }}"
      - type: entities
        title: Déplacer, renommer ou retirer
        entities:
          - entity: input_select.sejour_gerer_choix
            name: Scénario concerné

  # 3. Une catégorie de la galerie : un appui applique l'ambiance au groupe, un appui long
  #    l'applique en mélangeant ses couleurs entre les lampes (option `shuffle` de scene_presets).
  #    Les identifiants sont ceux du fichier presets.json de scene_presets.
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Galerie (extrait)
        icon: mdi:image-multiple
      - type: picture-glance
        title: Galaxie
        image: /assets/scene_presets/a6ba3a6e-1e3a-41fd-84f2-f7b021935deb.jpeg
        entities: []
        aspect_ratio: '1:1'
        grid_options:
          columns: 6
        tap_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a6ba3a6e-1e3a-41fd-84f2-f7b021935deb
            targets:
              entity_id: light.sejour_toutes_les_lampes
        hold_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: a6ba3a6e-1e3a-41fd-84f2-f7b021935deb
            shuffle: true
            targets:
              entity_id: light.sejour_toutes_les_lampes
      - type: picture-glance
        title: Lagon bleu
        image: /assets/scene_presets/58d2dda6-8689-46c7-931b-d3abd039f04b.jpeg
        entities: []
        aspect_ratio: '1:1'
        grid_options:
          columns: 6
        tap_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: 58d2dda6-8689-46c7-931b-d3abd039f04b
            targets:
              entity_id: light.sejour_toutes_les_lampes
        hold_action:
          action: perform-action
          perform_action: scene_presets.apply_preset
          data:
            preset_id: 58d2dda6-8689-46c7-931b-d3abd039f04b
            shuffle: true
            targets:
              entity_id: light.sejour_toutes_les_lampes
