# Paquet Home Assistant : ce dont le composant sejour_scenes a besoin autour de lui.
# À copier dans le dossier packages/ (configuration.yaml doit contenir, sous `homeassistant:`,
# `packages: !include_dir_named packages`). Le composant lui-même se charge par la ligne
# `sejour_scenes:` dans configuration.yaml.
# Entités renommées pour l'exemple : light.sejour_1 à light.sejour_7.

# Le groupe des 7 lampes : une seule entité pour tout allumer, éteindre ou régler.
light:
  - platform: group
    name: Séjour (toutes les lampes)
    unique_id: sejour_toutes_les_lampes
    entities:
      - light.sejour_1
      - light.sejour_2
      - light.sejour_3
      - light.sejour_4
      - light.sejour_5
      - light.sejour_6
      - light.sejour_7

# Les deux listes déroulantes du panneau de gestion. Leurs options sont réécrites par
# l'automatisation ci-dessous ; une option vaut « Titre || scene.xxx ».
input_select:
  sejour_ajouter_choix:
    name: "Séjour - scénario à ajouter"
    options:
      - "(aucun)"
  sejour_gerer_choix:
    name: "Séjour - scénario à déplacer/renommer/retirer"
    options:
      - "(aucun)"

automation:
  - id: '1784900000010'
    alias: Sejour scenes - rafraichir les listes de selection
    description: Maintient a jour les options des menus deroulants ajouter/gerer du
      gestionnaire de scenarios Sejour
    trigger:
    - platform: state
      entity_id: sensor.sejour_scenes_list
    - platform: homeassistant
      event: start
    action:
    - variables:
        current_entities: '{{ state_attr(''sensor.sejour_scenes_list'', ''list'') |
          default([]) | map(attribute=''entity'') | list }}'
    # « Gérer » : les scènes de la liste.
    - action: input_select.set_options
      target:
        entity_id: input_select.sejour_gerer_choix
      data:
        options: '{{ (zip(state_attr(''sensor.sejour_scenes_list'', ''list'') | default([])
          | map(attribute=''title'') | list, state_attr(''sensor.sejour_scenes_list'',
          ''list'') | default([]) | map(attribute=''entity'') | list) | map(''join'',
          '' || '') | list) or [''(aucun)''] }}'
    # « Ajouter » : toutes les scènes de HA qui n'y sont pas encore.
    - action: input_select.set_options
      target:
        entity_id: input_select.sejour_ajouter_choix
      data:
        options: '{{ (zip((states.scene | rejectattr(''entity_id'', ''in'', current_entities)
          | list) | map(attribute=''name'') | list, (states.scene | rejectattr(''entity_id'',
          ''in'', current_entities) | list) | map(attribute=''entity_id'') | list) |
          map(''join'', '' || '') | list) or [''(aucun)''] }}'
    mode: single
